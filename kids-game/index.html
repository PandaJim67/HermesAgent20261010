<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>小朋友學習樂園｜Kids Learning Game</title>
<style>
:root{
  --pink:#ff5fa2;--pink2:#ffd6e8;--blue:#3aa7ff;--blue2:#d6ecff;--green:#3ecf8e;
  --orange:#ff9f45;--purple:#9b6dff;--yellow:#ffd23f;
  --ink:#3a2f4f;--white:#fff;--bg1:#fff7fb;--bg2:#eef6ff;
  --font:'Comic Sans MS','Chalkboard SE','Segoe UI Rounded',-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);min-height:100%;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#fff);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
/* floating deco */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 12% 20%,#ffd6e8 0 10px,transparent 11px),
   radial-gradient(circle at 85% 15%,#d6ecff 0 12px,transparent 13px),
   radial-gradient(circle at 78% 80%,#ffe9a8 0 10px,transparent 11px),
   radial-gradient(circle at 15% 82%,#d8ffb4 0 9px,transparent 10px)}

.app{width:100%;max-width:560px;background:rgba(255,255,255,.92);border:4px solid #fff;
  border-radius:34px;box-shadow:0 20px 50px rgba(90,60,120,.18);padding:clamp(18px,4vw,30px);position:relative;z-index:1}

/* screens */
.screen{display:none}
.screen.on{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* HOME */
.h-title{text-align:center;font-size:clamp(1.6rem,6vw,2.3rem);font-weight:800;margin:6px 0 2px}
.h-title .a{color:var(--pink)}.h-title .b{color:var(--blue)}
.h-sub{text-align:center;font-size:.95rem;color:#8a7ea0;margin-bottom:20px}
.h-mascot{text-align:center;font-size:3rem;line-height:1;margin-bottom:8px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
@media (max-width:420px){.mode-grid{grid-template-columns:1fr}}
.mode{border:none;cursor:pointer;font-family:var(--font);border-radius:24px;padding:20px 14px;
  color:#fff;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:center}
.mode:hover{transform:translateY(-3px)}
.mode:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.mode .ic{font-size:2.6rem;display:block;margin-bottom:8px}
.mode .nm{font-size:1.15rem;font-weight:800}
.mode .ds{font-size:.78rem;opacity:.9;margin-top:3px}
.m-en{background:linear-gradient(160deg,var(--pink),var(--orange))}
.m-ma{background:linear-gradient(160deg,var(--blue),var(--purple))}

.back{display:block;width:100%;margin-top:6px;background:var(--yellow);color:#5a4a00;font-weight:800;
  font-size:1rem;border:none;border-radius:16px;padding:13px;cursor:pointer;font-family:var(--font);
  box-shadow:0 5px 0 #e6b800}
.back:active{transform:translateY(2px);box-shadow:0 3px 0 #e6b800}

/* GAME */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.chip{background:#fff;border:3px solid var(--blue2);color:var(--ink);font-weight:800;font-size:.95rem;
  border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:6px}
.chip.score{border-color:var(--pink2);color:var(--pink)}
.iconbtn{border:3px solid var(--blue2);background:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;
  font-size:1.2rem;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{border-color:var(--blue)}
.iconbtn:active{transform:scale(.92)}

.mode-tag{text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:#9b8fc0;text-transform:uppercase;margin-bottom:8px}

/* prompt: image / problem */
.stage{background:linear-gradient(160deg,#fff,#f6f9ff);border:4px dashed var(--yellow);border-radius:26px;
  padding:20px;text-align:center;margin-bottom:16px;min-height:150px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px}
.stage .emoji{font-size:5rem;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08));animation:pop .3s ease}
.stage .zh{font-size:1.05rem;font-weight:700;color:#6a5f86}
.stage .say{font-size:.9rem;color:#9b8fc0;margin-top:2px}
.stage .problem{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;color:var(--ink);letter-spacing:.04em}
.stage .problem .op{color:var(--pink)}
.stage .qmark{color:var(--blue)}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.options{grid-template-columns:1fr}}
.opt{border:4px solid #fff;background:#fff;border-radius:20px;padding:16px;font-family:var(--font);
  font-size:1.4rem;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s;
  box-shadow:0 5px 0 #e7edf7;min-height:66px;display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.2}
.opt:hover{transform:translateY(-2px);border-color:var(--blue2)}
.opt:active{transform:translateY(2px)}
.opt.locked{pointer-events:none}
.opt.right{border-color:var(--green);background:#eafff4;box-shadow:0 5px 0 #bfe9d3;animation:win .45s ease}
.opt.wrong{border-color:var(--orange);background:#fff3e6;box-shadow:0 5px 0 #f4d2ac;animation:shake .4s ease}
.opt.hide{opacity:.45}
@keyframes win{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* feedback banner */
.feedback{height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;
  border-radius:18px;margin-bottom:14px;opacity:0;transition:opacity .2s;text-align:center;line-height:1.3}
.feedback.show{opacity:1}
.feedback.good{background:#eafff4;color:#1f9d63}
.feedback.bad{background:#fff3e6;color:#d97706}

.next{display:block;width:100%;border:none;font-family:var(--font);font-weight:800;font-size:1.05rem;
  background:linear-gradient(160deg,var(--blue),var(--purple));color:#fff;border-radius:18px;padding:15px;
  cursor:pointer;box-shadow:0 6px 0 #6b4ad0;opacity:.5;pointer-events:none}
.next.ready{opacity:1;pointer-events:auto}
.next:active{transform:translateY(2px);box-shadow:0 3px 0 #6b4ad0}

/* confetti bits */
.burst{position:fixed;inset:0;pointer-events:none;z-index:50}
.burst i{position:absolute;width:12px;height:12px;border-radius:3px;opacity:0}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3) rotate(var(--r))}}

/* END */
.end{text-align:center}
.end .trophy{font-size:4.4rem;animation:bob 2s ease-in-out infinite}
.end h2{font-size:1.7rem;font-weight:800;margin:8px 0 4px}
.end .big{font-size:4.2rem;font-weight:800;color:var(--pink);line-height:1;margin:10px 0}
.end .big span{font-size:1.3rem;color:#9b8fc0}
.end .stars{font-size:1.8rem;margin:6px 0 14px;letter-spacing:6px}
.again{display:block;margin-top:8px;width:80%;background:linear-gradient(160deg,var(--green),#2bb673);color:#fff;
  border:none;font-family:var(--font);font-weight:800;font-size:1.1rem;border-radius:18px;padding:15px;cursor:pointer;
  box-shadow:0 6px 0 #1f9d63;margin-inline:auto}
.again:active{transform:translateY(2px);box-shadow:0 3px 0 #1f9d63}
.hint{text-align:center;font-size:.82rem;color:#9b8fc0;margin-top:14px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px;border-radius:10px}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <div class="screen on" id="home">
    <div class="h-mascot">🦊</div>
    <div class="h-title"><span class="a">小朋友</span><span class="b">學習樂園</span></div>
    <div class="h-sub">揀一個模式開始遊戲，答對越多分數越高！</div>
    <div class="mode-grid">
      <button class="mode m-en" id="mEn"><span class="ic">🖼️</span><span class="nm">英文生字</span><span class="ds">睇圖揀正確英文</span></button>
      <button class="mode m-ma" id="mMa"><span class="ic">🧮</span><span class="nm">數學計算</span><span class="ds">隨機加減找答案</span></button>
    </div>
    <button class="back" id="backHome">🏠 跳去導覽主頁</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="topbar">
      <button class="iconbtn" id="btnHome" aria-label="回主選單" title="回主選單">🏠</button>
      <div class="chip" id="progChip">第 1 題</div>
      <div class="chip score" id="scoreChip">⭐ 0</div>
    </div>
    <div class="mode-tag" id="modeTag">英文生字</div>
    <div class="stage" id="stage"></div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="next">下一題 →</button>
  </div>

  <!-- END -->
  <div class="screen" id="end">
    <div class="end">
      <div class="trophy" id="trophy">🏆</div>
      <h2>遊戲完成！</h2>
      <div class="big" id="endScore">0<span> / 10</span></div>
      <div class="stars" id="endStars">★★★</div>
      <button class="again" id="again">再玩一次</button>
      <button class="back" id="endHome">🏠 回主選單</button>
      <div class="hint">答對 8 題以上可得 3 顆星 🌟</div>
    </div>
  </div>

</div>

<div class="burst" id="burst"></div>

<script>
(function(){
  "use strict";
  var WORDS=[
    {e:"cat",c:"貓",ic:"🐱"},{e:"dog",c:"狗",ic:"🐶"},{e:"apple",c:"蘋果",ic:"🍎"},{e:"banana",c:"香蕉",ic:"🍌"},
    {e:"sun",c:"太陽",ic:"☀️"},{e:"moon",c:"月亮",ic:"🌙"},{e:"fish",c:"魚",ic:"🐟"},{e:"bird",c:"鳥",ic:"🐦"},
    {e:"car",c:"汽車",ic:"🚗"},{e:"book",c:"書",ic:"📖"},{e:"ball",c:"球",ic:"⚽"},{e:"milk",c:"牛奶",ic:"🥛"},
    {e:"penguin",c:"企鵝",ic:"🐧"},{e:"frog",c:"青蛙",ic:"🐸"},{e:"star",c:"星星",ic:"⭐"},{e:"flower",c:"花",ic:"🌸"},
    {e:"house",c:"房子",ic:"🏠"},{e:"rainbow",c:"彩虹",ic:"🌈"},{e:"duck",c:"小鴨",ic:"🦆"},{e:"cookie",c:"餅乾",ic:"🍪"}
  ];
  var TOTAL=10, COLORS=["#ff5fa2","#3aa7ff","#3ecf8e","#ff9f45","#9b6dff","#ffd23f"];
  var G={mode:null,q:0,score:0,lock:false,cur:null};

  var el={};
  ["home","game","end","mEn","mMa","backHome","btnHome","progChip","scoreChip","modeTag","stage","opts",
   "fb","next","trophy","endScore","endStars","again","endHome","burst"].forEach(function(id){el[id]=document.getElementById(id);});

  function show(name){
    ["home","game","end"].forEach(function(s){el[s].classList.toggle("on",s===name);});
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function pick(n){return shuffle(WORDS.slice()).slice(0,n);}

  // ---- English mode ----
  function makeEN(){
    var w=WORDS[Math.floor(Math.random()*WORDS.length)];
    var others=shuffle(WORDS.filter(function(x){return x.e!==w.e;})).slice(0,3);
    var options=shuffle([w.e].concat(others.map(function(o){return o.e;})));
    return {
      stage:'<div class="emoji">'+w.ic+'</div><div class="zh">'+w.c+'</div><div class="say">呢個英文係邊個？</div>',
      correct:w.e,
      options:options,
      hint:w.e
    };
  }

  // ---- Math mode ----
  function makeMA(){
    var add=Math.random()<0.5, a,b,ans;
    if(add){
      a=1+Math.floor(Math.random()*18); b=1+Math.floor(Math.random()*18);
      if(a+b>40) b=40-a;
      ans=a+b;
    } else {
      a=10+Math.floor(Math.random()*20); b=1+Math.floor(Math.random()*(a-1));
      ans=a-b;
    }
    var op=add?'+':'−';
    // distractors: neighbors
    var set={}; set[ans]=1; var tries=0;
    while(Object.keys(set).length<4 && tries<30){
      var d=ans+(Math.floor(Math.random()*7)-3);
      if(d>=0 && !set[d]) set[d]=1; tries++;
    }
    while(Object.keys(set).length<4){var d2=ans+4+Object.keys(set).length; if(!set[d2])set[d2]=1;}
    var opts=Object.keys(set).map(Number);
    return {
      stage:'<div class="problem">'+a+' <span class="op">'+op+'</span> '+b+' = <span class="qmark">?</span></div>',
      correct:ans,
      options:shuffle(opts),
      hint:ans
    };
  }

  function start(mode){
    G.mode=mode; G.q=0; G.score=0;
    el.modeTag.textContent = mode==="en" ? "🖼️ 英文生字" : "🧮 數學計算";
    show("game"); updateChips(); render();
  }
  function updateChips(){ el.scoreChip.textContent="⭐ "+G.score; el.progChip.textContent="第 "+(G.q+1)+" 題"; }
  function render(){
    G.cur = G.mode==="en" ? makeEN() : makeMA();
    G.lock=false;
    el.stage.innerHTML=G.cur.stage;
    el.fb.className="feedback"; el.fb.textContent="";
    el.next.classList.remove("ready");
    el.opts.innerHTML="";
    var order = G.mode==="en" ? G.cur.options : shuffle(G.cur.options.slice());
    order.forEach(function(v){
      var b=document.createElement("button");
      b.className="opt"; b.textContent = G.mode==="en" ? v : v;
      b.setAttribute("data-v", String(v));
      b.addEventListener("click",function(){answer(v,b);});
      el.opts.appendChild(b);
    });
  }
  function answer(v,btn){
    if(G.lock) return;
    G.lock=true;
    var ok = (G.mode==="en") ? (v===G.cur.correct) : (Number(v)===G.cur.correct);
    var btns=[].slice.call(el.opts.children);
    btns.forEach(function(b){
      b.classList.add("locked");
      if(b===btn) b.classList.add(ok?"right":"wrong");
      else if((b.getAttribute("data-v")===(G.mode==="en"?G.cur.correct:String(G.cur.correct)))) b.classList.add("right");
    });
    if(ok){
      G.score++;
      say("答對了！🎉","+1 分");
      burst();
    } else {
      say("唔啱，正確係 "+G.cur.hint,"再試下！");
    }
    updateChips();
    el.next.classList.add("ready");
  }
  function say(main,sub){
    el.fb.textContent = main + (sub ? "　"+sub : "");
    el.fb.className = "feedback show " + (main.indexOf("答對")>-1?"good":"bad");
  }
  function burst(){
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for(var i=0;i<16;i++){
      var s=document.createElement("i");
      s.style.left=(40+Math.random()*20)+"%";
      s.style.top="35%";
      s.style.background=COLORS[i%COLORS.length];
      var ang=Math.random()*Math.PI*2, dist=90+Math.random()*130;
      s.style.setProperty("--x",Math.cos(ang)*dist+"px");
      s.style.setProperty("--y",(Math.sin(ang)*dist - 40)+"px");
      s.style.setProperty("--r",(Math.random()*540)+"deg");
      s.style.animation="fly .7s ease forwards";
      el.burst.appendChild(s);
      (function(node){setTimeout(function(){node.remove();},720);})(s);
    }
  }

  function finish(){
    var correct=G.score;
    el.endScore.innerHTML = correct + " <span>/ " + TOTAL + "</span>";
    var stars = correct>=8?3 : correct>=5?2 : 1;
    el.endStars.textContent = "★".repeat(stars) + "☆".repeat(3-stars);
    el.endStars.style.color = stars>=3 ? "#ffd23f" : "#c9c2e0";
    el.trophy.textContent = stars>=3 ? "🏆" : stars===2 ? "🎖️" : "🌱";
    show("end");
    if(stars>=3) burst();
  }

  // wiring
  el.mEn.addEventListener("click",function(){start("en");});
  el.mMa.addEventListener("click",function(){start("ma");});
  el.next.addEventListener("click",function(){
    if(G.q>=TOTAL-1){ finish(); }
    else { G.q++; updateChips(); render(); }
  });
  function toHome(){show("home");}
  el.backHome.addEventListener("click",function(){window.location.href="../";});
  el.btnHome.addEventListener("click",toHome);
  el.endHome.addEventListener("click",toHome);
  el.again.addEventListener("click",function(){ start(G.mode||"en"); });

  // keyboard support (numbers for math / letters pick first matching option)
  document.addEventListener("keydown",function(e){
    if(!el.game.classList.contains("on")){
      if(e.key==="Enter" && el.home.classList.contains("on")) el.mEn.click();
      if(e.key==="1" && el.home.classList.contains("on")) el.mEn.click();
      if(e.key==="2" && el.home.classList.contains("on")) el.mMa.click();
      return;
    }
    if(G.lock){ if(e.key==="Enter"||e.key==="ArrowRight") el.next.click(); return; }
    if(G.mode==="ma"){
      if(/^[0-9]+$/.test(e.key)){
        var m=[].slice.call(el.opts.children).filter(function(b){return b.getAttribute("data-v")===e.key;})[0];
        if(m) m.click();
      }
    } else {
      var k=e.key.toLowerCase();
      if(/^[a-z]$/.test(k)){
        var m2=[].slice.call(el.opts.children).filter(function(b){return b.textContent.toLowerCase()===k;})[0];
        if(m2) m2.click();
      }
    }
    if(e.key==="Enter" && !G.lock) el.next.click();
  });
})();
</script>
</body>
</html>
