<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web App Navigator｜JimSir</title>
<meta name="description" content="Web App 專案導覽：卡片列出所有專案，支援搜尋與分類篩選。">
<style>
:root{
  --bg:#0e1118;--surface:#161b26;--surface-2:#1d2433;--ink:#eef2fb;--ink-2:#9aa4bd;--muted:#66708a;
  --line:#2a3245;--brand:#4353ff;--ok:#2fc79a;--dev:#f0a44a;--radius:16px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 20% -10%,rgba(67,83,255,.14),transparent 40%),
                   radial-gradient(circle at 90% 0%,rgba(0,194,168,.1),transparent 35%)}
.wrap{max-width:1120px;margin:0 auto;padding:40px 22px 64px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.brand{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.brand span{color:var(--brand)}
.top .sub{color:var(--ink-2);font-size:.9rem;margin-top:4px}
.count{font-size:.8rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 14px;font-weight:600}

/* controls */
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px 12px 42px;color:var(--ink);font-size:.92rem;font-family:var(--font);transition:.18s}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(67,83,255,.18)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
  padding:8px 15px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--font)}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;transition:.2s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:#39435e;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.card .bar{height:5px;background:var(--brand)}
.card .in{padding:20px 22px;flex:1;display:flex;flex-direction:column}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.badge{font-size:.72rem;font-weight:700;border-radius:999px;padding:4px 11px;white-space:nowrap}
.badge.ok{background:rgba(47,199,154,.16);color:var(--ok)}
.badge.dev{background:rgba(240,164,74,.16);color:var(--dev)}
.card .cat{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 6px}
.card p{font-size:.9rem;color:var(--ink-2);line-height:1.55;flex:1}
.stack{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.stack span{font-size:.72rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;color:var(--ink-2)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;
  padding-top:14px;border-top:1px solid var(--line)}
.card .foot .date{font-size:.74rem;color:var(--muted)}
.card .open{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--brand);
  background:none;border:none;cursor:pointer;font-family:var(--font);padding:6px 0;word-break:break-all;text-align:right}
.card .open:hover{text-decoration:underline}
.card .open svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:1rem;display:none}
.empty .big{font-size:2.4rem;margin-bottom:10px}

.hint{margin-top:28px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;
  padding:14px 18px;font-size:.84rem;color:var(--ink-2);line-height:1.6}
.hint code{background:var(--surface-2);border-radius:6px;padding:2px 7px;color:var(--brand);font-size:.8rem}

@media print{
  body{background:#fff;color:#111}
  .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">Web App <span>Navigator</span></div>
      <div class="sub" id="owner">我的 web 專案導覽</div>
    </div>
    <div class="count" id="count">載入中…</div>
  </div>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input type="search" id="q" placeholder="搜尋專案名稱、簡介或技術…" aria-label="搜尋專案">
    </div>
    <div class="chips" id="chips" role="group" aria-label="分類篩選"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="big">🔍</div>
    <div>冇找到符合條件嘅專案</div>
  </div>

  <div class="hint">
    <b style="color:var(--ink)">新增專案：</b>只須編輯 <code>projects.json</code> 嘅 <code>projects</code> 陣列，
    加入一個物件（<code>name / desc / stack / status / category / link</code>），push 後頁面自動更新。
  </div>
</div>

<script>
(function(){
  "use strict";
  var grid=document.getElementById('grid'),
      chips=document.getElementById('chips'),
      q=document.getElementById('q'),
      empty=document.getElementById('empty'),
      count=document.getElementById('count'),
      owner=document.getElementById('owner');
  var all=[], activeCat='全部', activeQ='';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function renderChips(cats){
    var list=['全部'].concat(cats);
    chips.innerHTML=list.map(function(c){
      return '<button class="chip'+(c===activeCat?' on':'')+'" data-cat="'+esc(c)+'" type="button">'+esc(c)+'</button>';
    }).join('');
    chips.querySelectorAll('.chip').forEach(function(b){
      b.addEventListener('click',function(){
        activeCat=b.getAttribute('data-cat');
        chips.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b);});
        applyFilter();
      });
    });
  }

  function cardHTML(p){
    var ok=p.status.indexOf('上線')>-1;
    var link=p.link||p.local||'#';
    var isExt=/^https?:/i.test(link);
    return '<article class="card" data-id="'+esc(p.id)+'">'
      +'<div class="bar" style="background:'+(esc(p.accent)||'var(--brand)')+'"></div>'
      +'<div class="in">'
        +'<div class="row1"><h3>'+esc(p.name)+'</h3>'
          +'<span class="badge '+(ok?'ok':'dev')+'">'+esc(p.status)+'</span></div>'
        +'<div class="cat">'+esc(p.category)+'</div>'
        +'<p>'+esc(p.desc)+'</p>'
        +'<div class="stack">'+(p.stack||[]).map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div>'
        +'<div class="foot">'
          +'<span class="date">'+(p.updated?('更新 '+esc(p.updated)):'')+'</span>'
          +'<a class="open" href="'+esc(link)+'"'+(isExt?' target="_blank" rel="noopener"':'')+'>'
            +esc(link.replace(/^https?:\/\//,''))
            +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M7 7h10v10"/></svg></a>'
        +'</div>'
      +'</div></article>';
  }

  function applyFilter(){
    var list=all.filter(function(p){
      if(activeCat!=='全部' && p.category!==activeCat) return false;
      if(activeQ){
        var hay=((p.name||'')+' '+(p.desc||'')+' '+(p.stack||[]).join(' ')+' '+(p.category||'')).toLowerCase();
        if(hay.indexOf(activeQ)<0) return false;
      }
      return true;
    });
    grid.innerHTML=list.map(cardHTML).join('');
    empty.style.display=list.length?'none':'block';
    count.textContent=list.length+' / '+all.length+' 個專案';
  }

  function boot(data){
    all=data.projects||[];
    var cats=data.categories||[];
    if(!cats.length){cats=[];all.forEach(function(p){if(p.category&&cats.indexOf(p.category)<0)cats.push(p.category);});}
    owner.textContent=(data.meta&&data.meta.owner)?('我的 web 專案導覽 · '+data.meta.owner):'我的 web 專案導覽';
    renderChips(cats);
    q.addEventListener('input',function(){activeQ=q.value.trim().toLowerCase();applyFilter();});
    applyFilter();
  }

  fetch('projects.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(boot)
    .catch(function(e){
      count.textContent='載入失敗';
      empty.style.display='block';
      empty.querySelector('.big').textContent='⚠️';
      empty.lastElementChild.textContent='projects.json 載入失敗（'+e.message+'）';
    });
})();
</script>
</body>
</html>
